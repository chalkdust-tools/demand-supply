<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>需要と供給 ワークシート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&display=swap">
<style>
:root{--ink:#1c2a2d;--muted:#56686b;--line:#b9c7c3;--demand:#1d67a8;--supply:#c84b17;--ans:#c0262d;--bg:#e9eeec;--paper:#fff}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;font-size:10.5pt;line-height:1.65;padding:0 16px}
.bar{max-width:210mm;margin:16px auto;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:14px}
.bar b{margin-right:4px}
.bar label{display:inline-flex;gap:4px;align-items:center;cursor:pointer}
.bar button{font:inherit;background:var(--ink);color:#fff;border:0;border-radius:6px;padding:6px 14px;cursor:pointer;font-weight:700}
.bar .note{color:var(--muted);font-size:12px;width:100%}
.sheet{max-width:210mm;margin:0 auto 24px;background:var(--paper);padding:14mm 14mm 16mm;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:6px;flex-wrap:wrap}
.top h1{font-family:"Dela Gothic One","BIZ UDPGothic",sans-serif;font-weight:400;font-size:18pt;margin:0;line-height:1.2}
.top .sub{font-size:9pt;color:var(--muted)}
.name{display:flex;gap:10px;font-size:10pt;align-items:flex-end}
.name span{border-bottom:1px solid var(--ink);display:inline-block;min-width:3.2em;text-align:right;padding-right:2px}
.name span.w{min-width:9em}
h2{font-size:13pt;margin:14pt 0 2pt;padding:2pt 8pt;background:#eef3f1;border-left:5px solid var(--ink);break-after:avoid}
h2 .lvl{font-size:8pt;border:1px solid var(--muted);color:var(--muted);border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:2px;font-weight:400}
.intro{font-size:9.5pt;color:var(--muted);margin:2pt 0 4pt}
.q{display:grid;grid-template-columns:1fr auto;gap:4pt 12pt;padding:6pt 0;border-bottom:1px dotted var(--line);break-inside:avoid}
.q .qt{margin:0}
.q .qt b{margin-right:4pt}
.q ol{list-style:none;margin:2pt 0 0;padding:0;display:flex;flex-wrap:wrap;gap:1pt 14pt}
.q ol li{white-space:nowrap}
.q .box{grid-column:2;grid-row:1;align-self:start;white-space:nowrap;font-size:10pt}
.q .box span{display:inline-block;min-width:3em;border:1px solid var(--ink);text-align:center;padding:1pt 4pt;margin-left:4pt;color:var(--ans);font-weight:700}
.q .fig{grid-column:1 / -1;display:flex;gap:10pt;align-items:center}
.q .fig svg{width:62mm;height:auto;flex:none}
.q .fig .how{font-size:9pt;color:var(--muted)}
.q .expl{grid-column:1 / -1;font-size:9pt;color:var(--ans);margin:0}
.wrapup{margin-top:6pt;break-inside:avoid}
.wrapup .lab{font-size:9pt;font-weight:700}
.lines{height:15mm;background:repeating-linear-gradient(to bottom,transparent 0,transparent 7mm,var(--line) 7mm,var(--line) 7.5mm)}
.wrapup .answ{color:var(--ans);font-size:9.5pt;margin:0}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff;padding:0}
  .bar{display:none}
  .sheet{box-shadow:none;margin:0;padding:0;max-width:none}
}
</style>
</head>
<body>
<div class="bar" id="bar">
  <b>印刷する章：</b><span id="picks"></span>
  <label><input type="checkbox" id="ans"> 解答を入れる（先生用）</label>
  <button id="printBtn">印刷する</button>
  <div class="note">問題はアプリと同じ lesson.js から作られます。問題を増やすと、このプリントにも自動で入ります。</div>
</div>
<div class="sheet" id="sheet"></div>

<script src="lesson.js"></script>
<script>
(() => {
  const L = window.LESSON || [];
  const KANA = ['ア','イ','ウ','エ','オ','カ'];
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const $ = id => document.getElementById(id);

  // 小さいグラフ（アプリと同じ計算）
  const W=240, H=180, X0=28, X1=230, Y0=10, Y1=160;
  const x = q => X0 + (X1-X0)*q/100, y = p => Y1 - (Y1-Y0)*p/100;
  const Pd = (q,s) => 90 - 0.8*(q - s), Ps = (q,s) => 10 + 0.8*(q - s);
  const Qd = (p,s) => s + (90-p)/0.8, Qs = (p,s) => s + (p-10)/0.8;
  const eq = (sD,sS) => { const q = 50 + 0.5*(sD+sS); return {q, p: Pd(q,sD)}; };
  let clipN = 0;
  const seg = (f, s, color, dash, w, id) => `<line x1="${x(-20)}" y1="${y(f(-20,s))}" x2="${x(120)}" y2="${y(f(120,s))}" stroke="${color}" stroke-width="${w||2}" ${dash?`stroke-dasharray="${dash}"`:''} clip-path="url(#${id})"/>`;

  function mini(show, act, answers){
    const id = 'c' + (clipN++);
    let g = `<svg viewBox="0 0 ${W} ${H+14}" xmlns="http://www.w3.org/2000/svg"><defs><clipPath id="${id}"><rect x="${X0}" y="${Y0}" width="${X1-X0}" height="${Y1-Y0}"/></clipPath></defs>`;
    for (let i=25;i<=100;i+=25){ g += `<line x1="${X0}" x2="${X1}" y1="${y(i)}" y2="${y(i)}" stroke="#e3e9e7"/><line y1="${Y0}" y2="${Y1}" x1="${x(i)}" x2="${x(i)}" stroke="#e3e9e7"/>`; }
    g += `<line x1="${X0}" y1="${Y0-4}" x2="${X0}" y2="${Y1}" stroke="#1c2a2d" stroke-width="1.2"/><line x1="${X0}" y1="${Y1}" x2="${X1+4}" y2="${Y1}" stroke="#1c2a2d" stroke-width="1.2"/>`;
    g += `<text x="${X0-4}" y="${Y0+6}" font-size="9" text-anchor="end" fill="#56686b">価格</text><text x="${X1}" y="${Y1+13}" font-size="9" text-anchor="end" fill="#56686b">数量</text>`;
    if (show.D){ g += seg(Pd,0,'#1d67a8',0,0,id); g += `<text x="${x(88)}" y="${y(Pd(88,0))+14}" font-size="11" font-weight="700" fill="#1d67a8">D</text>`; }
    if (show.S){ g += seg(Ps,0,'#c84b17',0,0,id); g += `<text x="${x(86)}" y="${y(Ps(86,0))-5}" font-size="11" font-weight="700" fill="#c84b17">S</text>`; }
    if (show.D && show.S){ const E=eq(0,0); g += `<circle cx="${x(E.q)}" cy="${y(E.p)}" r="3" fill="#1c2a2d"/><text x="${x(E.q)+5}" y="${y(E.p)-5}" font-size="9">E₀</text>`; }
    if (answers && act){
      if (act.type==='shift'){
        if (act.sD) g += seg(Pd,act.sD,'#c0262d','5 3',2,id);
        if (act.sS) g += seg(Ps,act.sS,'#c0262d','5 3',2,id);
        const E=eq(act.sD||0,act.sS||0); g += `<circle cx="${x(E.q)}" cy="${y(E.p)}" r="3" fill="#c0262d"/><text x="${x(E.q)+5}" y="${y(E.p)-5}" font-size="9" fill="#c0262d">E₁</text>`;
      } else if (act.type==='control'){
        g += `<line x1="${X0}" x2="${X1}" y1="${y(act.p)}" y2="${y(act.p)}" stroke="#c0262d" stroke-width="1.6" stroke-dasharray="4 3"/>`;
      } else if (act.type==='surplus'){
        const E=eq(0,0);
        g += `<polygon points="${x(0)},${y(Pd(0,0))} ${x(E.q)},${y(E.p)} ${x(0)},${y(E.p)}" fill="#1d67a8" fill-opacity=".25"/>`;
        if (act.show!=='cs') g += `<polygon points="${x(0)},${y(Ps(0,0))} ${x(E.q)},${y(E.p)} ${x(0)},${y(E.p)}" fill="#c84b17" fill-opacity=".25"/>`;
      }
    }
    return g + '</svg>';
  }
  const HOW = { shift:'動いたあとの曲線と、新しい交点を書き込もう', control:'決められた価格の線を書き込もう', surplus:'余剰の部分に色をぬろう' };

  function render(){
    const picked = [...document.querySelectorAll('#picks input')].filter(i=>i.checked).map(i=>+i.value);
    const ans = $('ans').checked;
    let h = `<div class="top"><div><h1>需要と供給 ワークシート</h1><div class="sub">公共・政治経済　アプリ「需要と供給のグラフ」と一緒に使います${ans?'　［解答］':''}</div></div>
      <div class="name"><span>年</span><span>組</span><span>番</span>名前<span class="w"></span></div></div>`;
    picked.forEach(ci => {
      const ch = L[ci];
      h += `<h2>第${ci+1}章　${esc(ch.title)}${ch.level?`<span class="lvl">${esc(ch.level)}</span>`:''}</h2><p class="intro">${esc(ch.intro)}</p>`;
      ch.questions.forEach((Q,qi) => {
        const CH = window.choiceOrder ? window.choiceOrder(Q) : Q.choices, ai = CH.indexOf(Q.a);
        h += `<div class="q"><div><p class="qt"><b>問${qi+1}</b>${esc(Q.q)}</p><ol>${CH.map((c,i)=>`<li>${KANA[i]}　${esc(c)}</li>`).join('')}</ol></div>
          <div class="box">答え<span>${ans ? KANA[ai] : '&nbsp;'}</span></div>`;
        if (Q.act && HOW[Q.act.type]) h += `<div class="fig">${mini({D:!!ch.show.D,S:!!ch.show.S}, Q.act, ans)}<span class="how">${HOW[Q.act.type]}</span></div>`;
        if (ans && Q.explain) h += `<p class="expl">${esc(Q.explain)}</p>`;
        h += `</div>`;
      });
      h += `<div class="wrapup"><div class="lab">この章でわかったこと</div>${ans ? `<p class="answ">${esc(ch.wrap||'')}</p>` : '<div class="lines"></div>'}</div>`;
    });
    $('sheet').innerHTML = h;
  }

  $('picks').innerHTML = L.map((ch,i) => `<label><input type="checkbox" value="${i}" ${ch.level?'':'checked'}>${i+1}${esc(ch.title)}</label>`).join(' ');
  document.querySelectorAll('#picks input').forEach(i => i.addEventListener('change', render));
  $('ans').addEventListener('change', render);
  $('printBtn').addEventListener('click', () => window.print());
  if (location.search.includes('answers')) $('ans').checked = true;
  if (location.search.includes('all')) document.querySelectorAll('#picks input').forEach(i => i.checked = true);
  render();
})();
</script>
</body>
</html>
